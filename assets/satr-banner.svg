<svg xmlns="http://www.w3.org/2000/svg" width="300" height="340" viewBox="0 0 300 340">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9333ea"/>
      <stop offset="50%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#9333ea"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c084fc"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
    <linearGradient id="cyanPurple" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#9333ea"/>
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="55%">
      <stop offset="0%" style="stop-color:#111827"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Outermost pulsing ring -->
  <circle cx="150" cy="150" r="148" fill="none" stroke="url(#borderGrad)" stroke-width="0.5" opacity="0.3" filter="url(#softGlow)"/>

  <!-- Outer border ring -->
  <circle cx="150" cy="150" r="143" fill="none" stroke="url(#borderGrad)" stroke-width="2.5"/>

  <!-- Second ring -->
  <circle cx="150" cy="150" r="137" fill="none" stroke="url(#cyanPurple)" stroke-width="0.7" opacity="0.5"/>

  <!-- Third decorative ring -->
  <circle cx="150" cy="150" r="130" fill="none" stroke="url(#borderGrad)" stroke-width="0.4" opacity="0.25" stroke-dasharray="4 6"/>

  <!-- Main circle background -->
  <circle cx="150" cy="150" r="140" fill="url(#bgGrad)"/>

  <!-- Inner ambient glow -->
  <circle cx="150" cy="130" r="75" fill="#7c3aed" opacity="0.07" filter="url(#softGlow)"/>
  <circle cx="175" cy="160" r="50" fill="#06b6d4" opacity="0.06" filter="url(#softGlow)"/>

  <!-- ─── Circuit traces ─── -->
  <!-- Top left trace -->
  <g stroke="url(#borderGrad)" stroke-width="1.2" fill="none" opacity="0.55">
    <polyline points="80,55 80,35 100,35"/>
    <circle cx="100" cy="35" r="2.5" fill="url(#borderGrad)" opacity="0.9"/>
    <circle cx="80" cy="55" r="1.8" fill="url(#cyanPurple)" opacity="0.9"/>
  </g>
  <!-- Top right trace -->
  <g stroke="url(#cyanPurple)" stroke-width="1.2" fill="none" opacity="0.55">
    <polyline points="220,55 220,35 200,35"/>
    <circle cx="200" cy="35" r="2.5" fill="url(#cyanPurple)" opacity="0.9"/>
    <circle cx="220" cy="55" r="1.8" fill="url(#borderGrad)" opacity="0.9"/>
  </g>
  <!-- Bottom left trace -->
  <g stroke="url(#cyanPurple)" stroke-width="1.2" fill="none" opacity="0.55">
    <polyline points="75,215 55,215 55,235"/>
    <circle cx="55" cy="235" r="2.5" fill="url(#borderGrad)" opacity="0.9"/>
  </g>
  <!-- Bottom right trace -->
  <g stroke="url(#borderGrad)" stroke-width="1.2" fill="none" opacity="0.55">
    <polyline points="225,215 245,215 245,235"/>
    <circle cx="245" cy="235" r="2.5" fill="url(#cyanPurple)" opacity="0.9"/>
  </g>
  <!-- Left mid trace -->
  <g stroke="url(#borderGrad)" stroke-width="1" fill="none" opacity="0.4">
    <polyline points="18,130 35,130 35,150 18,150"/>
    <circle cx="18" cy="130" r="2" fill="url(#borderGrad)" opacity="0.8"/>
    <circle cx="18" cy="150" r="2" fill="url(#cyanPurple)" opacity="0.8"/>
  </g>
  <!-- Right mid trace -->
  <g stroke="url(#cyanPurple)" stroke-width="1" fill="none" opacity="0.4">
    <polyline points="282,130 265,130 265,150 282,150"/>
    <circle cx="282" cy="130" r="2" fill="url(#cyanPurple)" opacity="0.8"/>
    <circle cx="282" cy="150" r="2" fill="url(#borderGrad)" opacity="0.8"/>
  </g>

  <!-- ─── Decorative sparkles ─── -->
  <!-- Top sparkle -->
  <g filter="url(#glow)" opacity="0.85">
    <line x1="150" y1="10" x2="150" y2="22" stroke="#c084fc" stroke-width="1.5"/>
    <line x1="144" y1="16" x2="156" y2="16" stroke="#c084fc" stroke-width="1.5"/>
    <line x1="146" y1="12" x2="154" y2="20" stroke="#c084fc" stroke-width="0.8"/>
    <line x1="154" y1="12" x2="146" y2="20" stroke="#c084fc" stroke-width="0.8"/>
  </g>
  <!-- Small side sparkles -->
  <g opacity="0.65">
    <circle cx="48" cy="80" r="1.5" fill="#22d3ee" filter="url(#glow)"/>
    <circle cx="42" cy="86" r="1" fill="#9333ea" filter="url(#glow)"/>
    <circle cx="252" cy="80" r="1.5" fill="#9333ea" filter="url(#glow)"/>
    <circle cx="258" cy="86" r="1" fill="#22d3ee" filter="url(#glow)"/>
    <circle cx="48" cy="220" r="1.5" fill="#9333ea" filter="url(#glow)"/>
    <circle cx="252" cy="220" r="1.5" fill="#22d3ee" filter="url(#glow)"/>
  </g>

  <!-- ─── AI chip icon top center ─── -->
  <g transform="translate(130, 34)" filter="url(#glow)" opacity="0.9">
    <rect x="0" y="0" width="40" height="28" rx="5" fill="#0f172a" stroke="url(#textGrad)" stroke-width="1.5"/>
    <!-- chip pins -->
    <line x1="8" y1="0" x2="8" y2="-5" stroke="url(#borderGrad)" stroke-width="1.2"/>
    <line x1="20" y1="0" x2="20" y2="-5" stroke="url(#borderGrad)" stroke-width="1.2"/>
    <line x1="32" y1="0" x2="32" y2="-5" stroke="url(#borderGrad)" stroke-width="1.2"/>
    <line x1="8" y1="28" x2="8" y2="33" stroke="url(#cyanPurple)" stroke-width="1.2"/>
    <line x1="20" y1="28" x2="20" y2="33" stroke="url(#cyanPurple)" stroke-width="1.2"/>
    <line x1="32" y1="28" x2="32" y2="33" stroke="url(#cyanPurple)" stroke-width="1.2"/>
    <!-- AI text in chip -->
    <text x="20" y="20" font-size="13" font-weight="800" font-family="'Segoe UI', Arial" fill="url(#textGrad)" text-anchor="middle">AI</text>
  </g>

  <!-- ─── Main Arabic text ─── -->
  <text
    x="150" y="180"
    font-size="94"
    font-family="'Arial', 'Tahoma', sans-serif"
    fill="url(#textGrad)"
    text-anchor="middle"
    filter="url(#textGlow)"
  >سَطْر</text>

  <!-- ─── SATR EDU below circle ─── -->
  <text
    x="150" y="316"
    font-size="24"
    font-weight="900"
    font-family="'Segoe UI', 'Arial Black', sans-serif"
    fill="white"
    text-anchor="middle"
    letter-spacing="6"
    filter="url(#glow)"
  >SATR EDU</text>
</svg>
