<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="purple_cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c084fc"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
    <linearGradient id="icon_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#a855f7" flood-opacity="0.4"/>
    </filter>
    <clipPath id="rounded">
      <rect width="800" height="200" rx="16"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" rx="16" fill="url(#bg)"/>

  <!-- Subtle top gradient line -->
  <rect width="800" height="2" rx="1" fill="url(#purple_cyan)" opacity="0.7"/>

  <!-- Left glow blob -->
  <ellipse cx="80" cy="100" rx="100" ry="100" fill="#7c3aed" opacity="0.07" clip-path="url(#rounded)"/>
  <!-- Right glow blob -->
  <ellipse cx="720" cy="100" rx="100" ry="100" fill="#0891b2" opacity="0.07" clip-path="url(#rounded)"/>

  <!-- Icon circle -->
  <circle cx="100" cy="100" r="60" fill="#0d1117" stroke="url(#icon_grad)" stroke-width="2" opacity="0.9" filter="url(#shadow)"/>

  <!-- Arabic سَطْر with tashkeel on top -->
  <text x="100" y="95" font-size="34" font-family="'Arial', 'Tahoma', sans-serif" fill="url(#icon_grad)"
        text-anchor="middle" filter="url(#glow)">سَطْر</text>

  <!-- SATR in English below -->
  <text x="100" y="125" font-size="18" font-weight="700" font-family="'Segoe UI', 'Arial', sans-serif"
        fill="url(#icon_grad)" text-anchor="middle" letter-spacing="3" filter="url(#glow)">SATR</text>

  <!-- Divider -->
  <line x1="185" y1="55" x2="185" y2="145" stroke="url(#purple_cyan)" stroke-width="1" opacity="0.3"/>

  <!-- SATR EDU text -->
  <text x="380" y="90" font-size="54" font-weight="800" font-family="'Segoe UI', 'Arial', sans-serif"
        fill="url(#purple_cyan)" text-anchor="middle" letter-spacing="6" filter="url(#glow)">SATR EDU</text>

  <!-- Tagline -->
  <text x="380" y="128" font-size="15" font-weight="400" font-family="'Segoe UI', 'Arial', sans-serif"
        fill="#64748b" text-anchor="middle" letter-spacing="3">AI-POWERED DOCUMENT INTELLIGENCE</text>

  <!-- Subtle bottom line -->
  <rect width="800" height="1" y="199" fill="url(#purple_cyan)" opacity="0.3"/>
</svg>
