# ── Satr Edu AI — NGINX Configuration ────────────────────────────────────────

# Rate limiting: 20 requests/second per IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

upstream fastapi_app {
    server app:8000;
    # لو في أكتر من instance زيد هنا:
    # server app2:8000;
    # server app3:8000;
}

server {
    listen 80;
    server_name _;

    # Max file upload size (10 MB — زي الـ config)
    client_max_body_size 10M;

    # Timeouts عشان الـ OCR والـ LLM بياخدوا وقت
    proxy_connect_timeout       60s;
    proxy_send_timeout          300s;
    proxy_read_timeout          300s;

    # Health check endpoint بدون rate limiting
    location /api/v1/base/health {
        proxy_pass http://fastapi_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # كل الـ API routes
    location /api/ {
        # Rate limiting: burst of 50 requests
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://fastapi_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastAPI Docs
    location /docs {
        proxy_pass http://fastapi_app;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://fastapi_app;
        proxy_set_header Host $host;
    }

    # Default: redirect للـ docs
    location / {
        proxy_pass http://fastapi_app;
        proxy_set_header Host $host;
    }
}
